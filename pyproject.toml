[project]
name = "etl-planilhas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "openpyxl",
  "pandas",
  "pandera",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "sqlalchemy",
  "typer",
]

[project.scripts]
etl = "etl.cli:app"

[project.optional-dependencies]
dev = ["pytest", "faker", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.setuptools.packages.find]
where = ["src"]
