[project]
name = "etl-planilhas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "openpyxl~=3.1",
  "pandas~=3.1",
  "pandera~=0.35.0",
  "psycopg[binary]~=3.3",
  "pydantic~=2.14",
  "pyyaml~=6.0",
  "sqlalchemy~=2.1",
  "typer~=0.29.0",
]

[project.scripts]
etl = "etl.cli:app"

[project.optional-dependencies]
dev = ["pytest", "faker", "ruff==0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.setuptools.packages.find]
where = ["src"]
